<style>
/* Layout: one-screen mobile app — header, card stack in the middle, answer buttons at the thumb. Light-only by brand rule. */
:root{
  --red:#E3002C; --black:#251F30; --white:#FFFFFF; --pink:#FFBCBC; --neutral:#675F6B; --accent:#804F91;
  --surface:#F9F9F9; --pink25:#FFEFEF; --pink50:#FFE0E0; --accent25:#D8CDE0; --neutral25:#D9D7DA; --black25:#CAC8CC;
  --font:'Roboto',sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--surface);color:var(--black);font-family:var(--font);font-size:16px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font-family:var(--font);cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 16px}
header{display:flex;align-items:center;justify-content:space-between;height:64px;flex-shrink:0}
header .logo{height:32px;width:auto;display:block}
header .logo svg{height:32px;width:auto;display:block}
.lang{display:flex;border:1px solid var(--neutral25);border-radius:8px;overflow:hidden;background:var(--white)}
.lang button{border:0;background:transparent;padding:6px 12px;font-size:14px;font-weight:700;color:var(--neutral)}
.lang button[aria-pressed="true"]{background:var(--black);color:var(--white)}
.screen{flex:1;display:flex;flex-direction:column;min-height:0}

/* Intro */
.intro{gap:20px;padding-top:8px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--red)}
h1{font-size:44px;line-height:1.02;font-weight:900;margin:0;letter-spacing:-.02em;text-wrap:balance}
.lede{font-size:17px;line-height:1.5;color:var(--neutral);margin:0}
.legend{display:grid;gap:8px}
.legend .row{display:flex;align-items:center;gap:12px;background:var(--white);border-radius:12px;padding:12px 14px;box-shadow:0 2px 8px rgba(37,31,48,.06)}
.legend .ic{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.legend .ic svg{width:22px;height:22px;stroke:currentColor;stroke-width:2.4;fill:none}
.legend b{display:block;font-size:16px}
.legend span{font-size:14px;color:var(--neutral)}
.c-day1{background:var(--accent);color:var(--white)}
.c-prob{background:var(--black);color:var(--white)}
.c-none{background:var(--neutral25);color:var(--black)}
.btn{border:0;border-radius:8px;padding:16px 24px;font-size:17px;font-weight:700}
.btn-primary{background:var(--red);color:var(--white)}
.btn-primary:active{background:#C80027}
.btn-ghost{background:transparent;color:var(--black);border:2px solid var(--black)}
.btn-link{background:none;border:0;color:var(--neutral);font-size:14px;font-weight:500;text-decoration:underline;padding:8px}
.deco{position:relative}
.deco{display:flex;justify-content:space-between;align-items:center;min-height:36px}
.deco .ge{width:36px;height:36px}
.deco .ge svg{width:36px;height:36px;display:block}
.meta{font-size:13px;color:var(--neutral);display:flex;gap:16px;flex-wrap:wrap}

/* Game */
.hud{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:4px 0 12px}
.bar{height:8px;background:var(--neutral25);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--red);width:0;transition:width .3s}
.count{font-size:13px;color:var(--neutral);margin-top:6px;font-variant-numeric:tabular-nums}
.pill{display:flex;align-items:center;gap:6px;background:var(--white);border-radius:999px;padding:8px 12px;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;box-shadow:0 2px 8px rgba(37,31,48,.06)}
.pill svg{width:18px;height:18px}
.pill.streak{color:var(--accent)}
.pill.streak.hot{background:var(--accent);color:var(--white)}
.stage{flex:1;position:relative;min-height:340px;margin:4px 0 16px;touch-action:none}
.card{position:absolute;inset:0;background:var(--white);border-radius:20px;box-shadow:0 10px 30px rgba(37,31,48,.12);display:flex;flex-direction:column;justify-content:space-between;padding:24px;user-select:none;-webkit-user-select:none;will-change:transform;overflow:hidden}
.card.back{transform:scale(.94) translateY(16px);box-shadow:0 4px 14px rgba(37,31,48,.08);opacity:.9}
.card .num{font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--neutral);text-transform:uppercase}
.card .q{font-size:34px;line-height:1.1;font-weight:900;letter-spacing:-.01em;text-wrap:balance}
.card .ask{font-size:15px;color:var(--neutral)}
.card .ge{position:absolute;right:20px;top:20px;width:44px;height:44px}
.card .ge svg{width:44px;height:44px;display:block}
.stamp{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) rotate(-8deg);padding:10px 18px;border-radius:10px;font-weight:900;font-size:22px;text-transform:uppercase;letter-spacing:.04em;opacity:0;pointer-events:none;border:3px solid;white-space:nowrap;background:var(--white)}
.stamp.s-day1{color:var(--accent);border-color:var(--accent)}
.stamp.s-prob{color:var(--black);border-color:var(--black)}
.stamp.s-none{color:var(--neutral);border-color:var(--neutral)}
.answers{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.ans{border:0;border-radius:14px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:700;line-height:1.2;min-height:84px;justify-content:center}
.ans svg{width:24px;height:24px;stroke:currentColor;stroke-width:2.4;fill:none}
.ans:active{transform:scale(.97)}
.toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);padding:10px 16px;border-radius:999px;font-weight:700;font-size:15px;display:flex;gap:8px;align-items:center;z-index:5;white-space:nowrap;box-shadow:0 6px 18px rgba(37,31,48,.18)}
.toast svg{width:18px;height:18px;stroke:currentColor;stroke-width:3;fill:none}
.toast.ok{background:var(--accent);color:var(--white)}
.toast.no{background:var(--white);color:var(--neutral);border:1.5px solid var(--neutral)}
.toast.show{animation:pop 1s ease forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-6px)}15%{opacity:1;transform:translate(-50%,0)}75%{opacity:1}100%{opacity:0}}
.hint{text-align:center;font-size:13px;color:var(--neutral);margin-top:10px}

/* Results */
.result{gap:20px;padding-top:8px}
.scorebox{background:var(--white);border-radius:20px;padding:24px;box-shadow:0 2px 8px rgba(37,31,48,.06);position:relative;overflow:hidden}
.scorebox .big{font-size:64px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.scorebox .unit{font-size:15px;color:var(--neutral);font-weight:500}
.scorebox .title{font-size:24px;font-weight:900;margin-top:16px;color:var(--red)}
.scorebox .sub{font-size:15px;color:var(--neutral);margin-top:4px;line-height:1.45}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:20px}
.stats div{background:var(--surface);border-radius:12px;padding:10px 12px}
.stats b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--neutral)}
.scorebox .ge{position:absolute;right:20px;top:20px;width:48px;height:48px}
.scorebox .ge svg{width:48px;height:48px;display:block}
h2{font-size:22px;font-weight:900;margin:8px 0 0}
.review{display:grid;gap:8px}
.ritem{background:var(--white);border-radius:12px;padding:14px;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.ritem .mk{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.ritem .mk svg{width:16px;height:16px;stroke:currentColor;stroke-width:3;fill:none}
.ritem .mk.ok{background:var(--accent);color:var(--white)}
.ritem .mk.no{background:var(--white);color:var(--neutral);border:1.5px solid var(--neutral)}
.ritem h3{margin:0;font-size:16px;font-weight:700;line-height:1.3}
.ritem .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:12px;font-weight:700;padding:4px 8px;border-radius:6px}
.tag.yours{background:var(--surface);color:var(--neutral);text-decoration:line-through}
.ritem p{margin:8px 0 0;font-size:14px;line-height:1.45;color:var(--neutral)}
.actions{display:grid;gap:10px}
.filter{display:flex;gap:6px}
.filter button{border:1.5px solid var(--black25);background:var(--white);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--neutral)}
.filter button[aria-pressed="true"]{border-color:var(--black);color:var(--black)}


@media (prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:.01ms!important}}
</style>

</head>

  <!-- INTRO -->

      <div class="eyebrow" data-t="eyebrow"></div>
      <div class="ge" aria-hidden="true" id="ge-intro"></div>
    </div>

        <button class="btn btn-primary" id="start" data-t="start"></button>

    </section>

  <!-- GAME -->
  <section class="screen" id="s-game" hidden>

function renderHud(){

  $("score").textContent = G.score;

}
function cardHTML(id,idx,cls){

    <div class="num">${String(idx+1).padStart(2,"0")} / ${BENEFITS.length}</div>

    <div class="stamp s-day1">${t("o_day1")}</div><div class="stamp s-prob">${t("o_prob")}</div><div class="stamp s-none">${t("o_none")}</div>

}

function bindDrag(card){
  let sx=0,sy=0,dx=0,dy=0,drag=false;
  const stamps={day1:card.querySelector(".s-day1"),probation:card.querySelector(".s-prob"),none:card.querySelector(".s-none")};
  const dir=()=>{ if(-dy>Math.abs(dx)&&-dy>40) return "probation"; if(dx>40) return "day1"; if(dx<-40) return "none"; return null; };
  card.addEventListener("pointerdown",e=>{ if(G.busy) return; drag=true; sx=e.clientX; sy=e.clientY; dx=dy=0; card.setPointerCapture(e.pointerId); card.style.transition="none"; });
  card.addEventListener("pointermove",e=>{
    if(!drag) return; dx=e.clientX-sx; dy=e.clientY-sy;
    card.style.transform=`translate(${dx}px,${Math.min(dy,40)}px) rotate(${dx/18}deg)`;
    const d=dir(); for(const k in stamps) stamps[k].style.opacity = k===d ? Math.min(1,(Math.max(Math.abs(dx),-dy)-40)/60) : 0;
  });
  const end=()=>{
    if(!drag) return; drag=false; const d=dir();
    const far = d==="probation" ? -dy>110 : Math.abs(dx)>110;
    if(d && far){ answer(d); }
    else { card.style.transition="transform .25s"; card.style.transform=""; for(const k in stamps) stamps[k].style.opacity=0; }
  };
  card.addEventListener("pointerup",end); card.addEventListener("pointercancel",end);
}
function answer(pick){
  if(!G || G.busy || G.i>=G.order.length) return;
  G.busy=true;
  const id=G.order[G.i], card=$("stage").querySelector(".card.front");
  const ok = answers[id]===pick;
  G.picks[id]=pick;
  if(ok){ G.streak++; G.best=Math.max(G.best,G.streak); G.score += 100 + Math.min(100,(G.streak-1)*25); }
  else G.streak=0;
  toast(ok);
  if(card){
    card.querySelectorAll(".stamp").forEach(s=>s.style.opacity=0);
    const s=card.querySelector(pick==="day1"?".s-day1":pick==="probation"?".s-prob":".s-none"); s.style.opacity=1;
    const tx = pick==="day1"?"translate(140%,0) rotate(18deg)":pick==="none"?"translate(-140%,0) rotate(-18deg)":"translate(0,-130%)";
    card.style.transition="transform .35s ease-in"; card.style.transform=tx;
  }
  setTimeout(()=>{ G.i++; G.busy=false; renderHud(); if(G.i>=G.order.length) finish(); else renderCards(); }, 340);
}
let toastTimer;
function toast(ok){
  const el=$("toast"); clearTimeout(toastTimer);
  el.className="toast "+(ok?"ok":"no");
  const extra = ok && G.streak>=2 ? ` · ${G.streak}× ${t("streak_x")}` : "";
  el.innerHTML=(ok?ICON_OK:ICON_NO)+`<span>${esc(t(ok?"correct":"wrong"))}${esc(extra)}</span>`;
  el.hidden=false; void el.offsetWidth; el.classList.add("show");
  toastTimer=setTimeout(()=>{el.hidden=true},1000);
}
document.querySelectorAll(".ans").forEach(b=>b.onclick=()=>answer(b.dataset.a));
document.addEventListener("keydown",e=>{
  if($("s-game").hidden) return;
  if(e.key==="ArrowRight") answer("day1"); else if(e.key==="ArrowLeft") answer("none"); else if(e.key==="ArrowUp"){e.preventDefault();answer("probation")}
});

/* ---------- Result ---------- */
let filterWrong=false;
function correctCount(){ return BENEFITS.filter(b=>G.picks[b.id]===answers[b.id]).length; }
function finish(){
  show("s-result"); filterWrong=false; renderResult();
}
function renderResult(){
  if(!G) return;
  const c=correctCount(), n=BENEFITS.length, p=c/n;
  const tier = p>=.9?4:p>=.7?3:p>=.5?2:1;
  $("r-score").textContent=G.score;
  $("r-title").textContent=t("t"+tier);
  $("r-sub").textContent=t("s"+tier);
  $("r-correct").textContent=c+"/"+n;
  $("r-acc").textContent=Math.round(p*100)+"%";
  $("r-streak").textContent=G.best;
  $("f-all").setAttribute("aria-pressed",!filterWrong); $("f-wrong").setAttribute("aria-pressed",filterWrong);
  const items = G.order.map(id=>BENEFITS.find(b=>b.id===id)).filter(b=>!filterWrong || G.picks[b.id]!==answers[b.id]);
  $("review").innerHTML = items.map(b=>{
    const ok=G.picks[b.id]===answers[b.id], right=answers[b.id];
    return `<div class="ritem"><div class="mk ${ok?"ok":"no"}" aria-label="${ok?t("correct"):t("wrong")}">${ok?ICON_OK:ICON_NO}</div>
      <div><h3>${esc(b[lang])}</h3>
      <div class="tags"><span class="tag ${OPTCLS[right]}">${esc(t(OPT[right]))}</span>${ok?"":`<span class="tag yours" title="${esc(t("you_said"))}">${esc(t(OPT[G.picks[b.id]]))}</span>`}</div>
      <p>${esc(lang==="lv"?b.nlv:b.nen)}</p></div></div>`;
  }).join("");
}
$("f-all").onclick=()=>{filterWrong=false;renderResult()};
$("f-wrong").onclick=()=>{filterWrong=true;renderResult()};
$("again").onclick=()=>{show("s-intro")};

/* ---------- Boot ---------- */
$("ge-intro").innerHTML=GE[1]; $("ge-result").innerHTML=GE[2];
$("start").onclick=startGame;
applyLang();

</script>
